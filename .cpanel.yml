---
# ============================================================
# .cpanel.yml - Auto Deploy Script untuk ArenHost
# ============================================================
# File ini dibaca otomatis oleh cPanel Git Version Control
# setiap kali "Deploy HEAD Commit" diklik.
#
# PENTING: Ganti CPANEL_USERNAME di bawah dengan username
# cPanel ArenHost Anda yang sebenarnya.
# ============================================================

deployment:
  tasks:
    - /bin/cp -rf checkout.php customization.php forgot-password.php gallery.php index.php invoice.php login.php logout.php my-orders.php notifications.php order.php payment.php product.php receipt.php register.php reset-password.php sync_products_db.php tracking.php database.sql /home/pelamina/public_html/
    - /bin/cp -rf admin /home/pelamina/public_html/
    - /bin/cp -rf assets /home/pelamina/public_html/
    - /bin/cp -rf includes /home/pelamina/public_html/
    - /bin/cp -rf uploads /home/pelamina/public_html/
    - /bin/cp -rf config/helpers.php /home/pelamina/public_html/config/
    - /bin/cp -rf config/settings.php /home/pelamina/public_html/config/
    - /bin/cp -rf .htaccess /home/pelamina/public_html/
    - /bin/chmod 755 /home/pelamina/public_html/uploads/
    - /bin/chmod 755 /home/pelamina/public_html/uploads/products/
    - /bin/chmod 755 /home/pelamina/public_html/uploads/payments/
